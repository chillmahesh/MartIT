# ==============================================================================
# Render Blueprint Specification for MartIT API
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: martit-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm run server:start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_ORIGINS
        sync: false # Set in Render Dashboard: e.g. https://your-app.vercel.app
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard: e.g. https://your-project.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard (SECRET)
      - key: FEATURE_MULTI_STORE_CHECKOUT
        value: "false"
      - key: MAKE_VERIFICATION_WEBHOOK_URL
        sync: false # Set in Render Dashboard: optional Make.com reconciliation webhook
      - key: MAKE_WEBHOOK_SECRET
        sync: false # Set in Render Dashboard: secret token for authenticating Make.com payment webhooks (SECRET)
